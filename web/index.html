<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猫咪健康助手 · Demo</title>
<style>
:root{
  --bg:#FBF7F2;
  --surface:#FFFFFF;
  --surface-2:#FCF4EF;
  --ink:#2B2724;
  --soft:#7C746C;
  --faint:#A89F96;
  --line:#EFE7DE;
  --accent:#EF6C4D;
  --accent-d:#DB5436;
  --accent-soft:#FDEDE8;
  --E0:#E5484D;
  --E1:#F0862A;
  --E2:#2FA56A;
  --E3:#8A94A6;
  --radius:18px;
  --shadow:0 1px 2px rgba(60,40,30,.05), 0 8px 24px rgba(60,40,30,.06);
  --shadow-sm:0 1px 2px rgba(60,40,30,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{
  margin:0;height:100%;
  background:
    radial-gradient(1200px 500px at 80% -10%, #FCEfe6 0%, rgba(252,239,230,0) 60%),
    radial-gradient(900px 500px at -10% 110%, #F3F0FF 0%, rgba(243,240,255,0) 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.app{
  height:100dvh;display:flex;flex-direction:column;
  max-width:860px;margin:0 auto;
}
/* ---------------- top bar ---------------- */
.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(150%) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .mascot{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(160deg,#FFE3D8,#FBD9CE);
  display:grid;place-items:center;box-shadow:var(--shadow-sm);
  flex:0 0 auto;
}
.topbar .ttl{display:flex;flex-direction:column;line-height:1.25;}
.topbar .ttl b{font-size:16px;font-weight:700;letter-spacing:.2px;}
.topbar .ttl span{font-size:11.5px;color:var(--soft);}
.topbar .spacer{flex:1 1 auto;}
.pill{
  font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;
  background:#F1EAE2;color:var(--soft);white-space:nowrap;
}
.pill.E0{background:var(--E0);color:#fff;}
.pill.E1{background:var(--E1);color:#fff;}
.pill.E2{background:var(--E2);color:#fff;}
.pill.E3{background:var(--E3);color:#fff;}
.btn-ghost{
  border:1px solid var(--line);background:var(--surface);color:var(--soft);
  font-size:12.5px;padding:7px 13px;border-radius:10px;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
/* ---------------- chat ---------------- */
.chat{
  flex:1 1 auto;overflow-y:auto;
  padding:20px 16px 8px;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
}
.welcome{
  margin:auto;text-align:center;max-width:460px;padding:18px 8px;
}
.welcome .big{
  width:78px;height:78px;margin:0 auto 14px;border-radius:24px;
  background:linear-gradient(160deg,#FFE3D8,#FBD9CE);
  display:grid;place-items:center;box-shadow:var(--shadow);
}
.welcome h2{margin:0 0 8px;font-size:19px;font-weight:700;}
.welcome p{margin:0;color:var(--soft);font-size:13.5px;}
.welcome .hint{margin-top:14px;font-size:12px;color:var(--faint);}

.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%;}
.msg .ava{
  flex:0 0 34px;width:34px;height:34px;border-radius:12px;
  background:linear-gradient(160deg,#FFE3D8,#FBD9CE);
  display:grid;place-items:center;box-shadow:var(--shadow-sm);
}
.msg.user{flex-direction:row-reverse;}
.msg.user .ava{background:linear-gradient(160deg,#FFE0D2,#FFC9B6);}
.bubble{
  max-width:84%;
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;border-top-left-radius:5px;
  padding:13px 15px;box-shadow:var(--shadow-sm);
}
.msg.user .bubble{
  background:linear-gradient(160deg,#FFE9E1,#FFDCCF);
  border-color:#FBD2C2;border-top-left-radius:16px;border-top-right-radius:5px;
  color:#5a2c1f;
}
.b-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.b-head .name{font-size:12px;font-weight:700;color:var(--soft);}
.b-head .lvl{
  font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;
}
.b-head .lvl.E0{background:var(--E0);}
.b-head .lvl.E1{background:var(--E1);}
.b-head .lvl.E2{background:var(--E2);}
.b-head .lvl.E3{background:var(--E3);}
.b-text{white-space:pre-wrap;word-break:break-word;}
.boundary{
  margin-top:10px;font-size:12px;line-height:1.55;color:#9a5a3c;
  background:var(--surface-2);border:1px solid #F6E2D8;
  border-radius:10px;padding:8px 11px;
}
.dos{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
.dos .tag{
  font-size:12px;padding:4px 10px;border-radius:999px;
  background:#EAF6EF;color:#1f7a4d;border:1px solid #D6EEDD;
}
.dos .tag.no{background:#FCEFEC;color:#c0392b;border-color:#F6DAD3;}
/* 下一步追问：纯文字引导，不可点击，避免整段追问被误发 */
.nextask{margin-top:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;}
.nextask-h{font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:5px;}
.nextask-list{display:flex;flex-direction:column;gap:4px;}
.nextask-item{font-size:12.5px;color:var(--ink);line-height:1.5;}
.nextask-item::before{content:"›";color:var(--faint);margin-right:6px;}
/* ---------------- foldables ---------------- */
.fold{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px;}
.foldBtn{
  display:flex;align-items:center;gap:7px;width:100%;
  background:transparent;border:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--soft);
  padding:3px 0;
}
.foldBtn .fi{font-size:13px;}
.foldBtn .fb{flex:1 1 auto;text-align:left;}
.foldBtn .fbadge{
  font-size:11px;font-weight:700;color:var(--accent-d);
  background:var(--accent-soft);padding:1px 8px;border-radius:999px;
}
.foldBtn .chev{transition:.2s;color:var(--faint);}
.fold.open .foldBtn .chev{transform:rotate(90deg);}
.foldPanel{margin-top:8px;}
/* intent grid */
.intent-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;}
.intent-grid dt{color:var(--faint);}
.intent-grid dd{margin:0;color:var(--ink);}
.sym{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;}
.sym .s{font-size:11.5px;background:#F3EEE8;color:var(--soft);padding:2px 8px;border-radius:999px;}
/* evidence */
.evi{
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  background:var(--surface);margin-bottom:8px;
}
.evi .src{font-size:12.5px;font-weight:600;color:var(--ink);}
.evi .src .kb{font-size:11px;color:var(--accent-d);background:var(--accent-soft);padding:1px 7px;border-radius:999px;margin-right:6px;}
.evi .org{font-size:11px;color:var(--faint);margin-left:6px;font-weight:400;}
.evi .ex{font-size:12.5px;color:var(--soft);margin-top:5px;}
.evi .meta{font-size:11px;color:var(--faint);margin-top:5px;word-break:break-all;}
/* trace */
.trace{
  font-family:ui-monospace,"SFMono-Regular","Menlo",Consolas,monospace;
  font-size:11.5px;line-height:1.6;color:var(--ink);
  background:#FBF9F6;border:1px solid var(--line);border-radius:11px;padding:11px 12px;
  white-space:pre-wrap;word-break:break-word;
}
.trace .lv{color:var(--E1);font-weight:700;}
.trace .ok{color:var(--E2);}
.trace .iss{color:var(--E0);}
.trace .step{border-bottom:1px dashed var(--line);padding:6px 0;}
.trace .step:last-child{border-bottom:none;}
.trace-note{font-size:12px;color:var(--soft);background:var(--surface-2);border-radius:10px;padding:8px 11px;margin-bottom:8px;}
/* typing */
.typing .bubble{display:flex;gap:5px;padding:15px 16px;}
.typing .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite;}
.typing .dot:nth-child(2){animation-delay:.2s;}
.typing .dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
/* ---------------- composer ---------------- */
.composerWrap{
  flex:0 0 auto;
  background:rgba(255,255,255,.9);
  backdrop-filter:saturate(150%) blur(10px);
  border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
.quick{
  display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;
  scrollbar-width:none;
}
.quick::-webkit-scrollbar{display:none;}
.quick button{
  flex:0 0 auto;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-family:inherit;font-size:12.5px;
  padding:7px 12px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.quick button:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d);}
.composer{display:flex;gap:9px;align-items:flex-end;}
.composer textarea{
  flex:1;resize:none;border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;min-height:46px;max-height:150px;font-family:inherit;font-size:14.5px;
  background:var(--surface);color:var(--ink);outline:none;transition:.15s;line-height:1.5;
}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.composer button.send{
  flex:0 0 auto;background:var(--accent);color:#fff;border:none;
  font-family:inherit;font-size:14px;font-weight:600;
  padding:0 20px;height:46px;border-radius:14px;cursor:pointer;transition:.15s;
}
.composer button.send:hover{background:var(--accent-d);}
.composer button.send:disabled{background:var(--faint);cursor:not-allowed;}
.disclaimer{font-size:11px;color:var(--faint);text-align:center;margin-top:8px;}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
  background:rgba(40,30,25,.9);color:#fff;padding:9px 15px;border-radius:10px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
}
.toast.show{opacity:1;}
@media (max-width:560px){
  .bubble{max-width:90%;}
  .topbar .ttl span{display:none;}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="mascot" id="mascotTop"></div>
    <div class="ttl">
      <b>猫咪健康助手</b>
      <span>描述情况，帮你判断要不要紧急就医</span>
    </div>
    <div class="spacer"></div>
    <span id="urgPill" class="pill">—</span>
    <button class="btn-ghost" onclick="resetSession()">重置</button>
  </header>

  <main class="chat" id="chatBox" aria-live="polite"></main>

  <div class="composerWrap">
    <div class="quick" id="quick"></div>
    <div class="composer">
      <textarea id="input" placeholder="猫咪今天怎么了？比如：精神、吃喝、排泄、呕吐或外伤…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button class="send" id="sendBtn" onclick="send()">发送</button>
    </div>
    <div class="disclaimer">本助手基于权威养宠知识做风险分流，<b>不能替代执业兽医诊断</b>；紧急情况请直接就医。</div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
 * 客户端：单文件 vanilla JS。默认相对路径。
 * 布局重构（v2）：聊天外壳 + 内置意图/安全/证据 + 调试推理折叠。
 * debug=1 → 显示每条回复的「我是怎么思考的」面板。
 * ============================================================ */
const params = new URLSearchParams(location.search);
const DEBUG = params.get('debug') === '1';
const sessionId = (localStorage.getItem('catAgentSession') ||
  'web-' + Math.random().toString(36).slice(2, 10));
localStorage.setItem('catAgentSession', sessionId);

const URG = {
  E0: { t: '立即就医', d: '危险信号，请尽快送医' },
  E1: { t: '尽快关注', d: '建议今天内留意或咨询' },
  E2: { t: '居家观察', d: '可先居家护理观察' },
  E3: { t: '一般咨询', d: '常规养护建议' },
};

document.getElementById('mascotTop').innerHTML = catSvg(26);

/* ---------- quick prompts（点击即试，降低开口门槛） */
const QUICK = [
  { label: '我家小白吃了百合', icon: '🌸' },
  { label: '大橘今天只尿出几滴', icon: '💧' },
  { label: '小黑今天吐了', icon: '🤮' },
  { label: '小白最近掉毛很厉害', icon: '🐾' },
  { label: '小花打喷嚏流鼻涕', icon: '🤧' },
  { label: '咪咪被车撞了一直流血', icon: '🩸' },
];
const quickEl = document.getElementById('quick');
QUICK.forEach(q => {
  const b = document.createElement('button');
  b.textContent = q.icon + ' ' + q.label;
  b.onclick = () => { setInput(q.label); send(); };
  quickEl.appendChild(b);
});

/* ---------- helpers ---------- */
function catSvg(size) {
  return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="20" cy="23" r="13" fill="#EF6C4D"/>
    <path d="M9 13 L13.5 23 L6.5 20.5 Z" fill="#EF6C4D"/>
    <path d="M31 13 L26.5 23 L33.5 20.5 Z" fill="#EF6C4D"/>
    <circle cx="15" cy="22" r="2.3" fill="#2B2724"/>
    <circle cx="25" cy="22" r="2.3" fill="#2B2724"/>
    <path d="M18.5 27 Q20 28.6 21.5 27" stroke="#2B2724" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="25.3" r="1.4" fill="#2B2724"/>
    <path d="M14 25 H7 M14.5 27 H8" stroke="#2B2724" stroke-width="1" stroke-linecap="round" opacity=".45"/>
    <path d="M26 25 H33 M25.5 27 H32" stroke="#2B2724" stroke-width="1" stroke-linecap="round" opacity=".45"/>
  </svg>`;
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch (_) { j = { error: { code: 'parse', message: t } }; }
  if (!r.ok) throw j.error || { code: String(r.status), message: t };
  return j;
}

function setInput(text) {
  const el = document.getElementById('input');
  el.value = text; el.focus();
}
function autoGrow() {
  const el = document.getElementById('input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  kids.forEach(k => k && e.appendChild(k.nodeType ? k : document.createTextNode(k ?? '')));
  return e;
}

/* ---------- 折叠面板 ---------- */
function makeFold(icon, label, badge, contentEl, openByDefault) {
  const wrap = el('div', { class: 'fold' + (openByDefault ? ' open' : '') });
  const btn = el('button', { class: 'foldBtn', type: 'button' });
  btn.innerHTML =
    `<span class="fi">${icon}</span><span class="fb">${label}</span>` +
    (badge ? `<span class="fbadge">${badge}</span>` : '') +
    `<span class="chev">▸</span>`;
  const panel = el('div', { class: 'foldPanel' });
  panel.appendChild(contentEl);
  btn.onclick = () => {
    const open = wrap.classList.toggle('open');
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
  };
  panel.hidden = !openByDefault;
  wrap.appendChild(btn); wrap.appendChild(panel);
  return wrap;
}

/* ---------- typing indicator ---------- */
function showTyping() {
  const box = document.getElementById('chatBox');
  const m = el('div', { class: 'msg assistant typing', id: 'typing' });
  m.appendChild(el('div', { class: 'ava', html: catSvg(22) }));
  m.appendChild(el('div', { class: 'bubble' },
    el('span', { class: 'dot' }), el('span', { class: 'dot' }), el('span', { class: 'dot' })));
  box.appendChild(m);
  box.scrollTop = box.scrollHeight;
  return m;
}

/* ---------- welcome ---------- */
function showWelcome() {
  const box = document.getElementById('chatBox');
  const w = el('div', { class: 'welcome' });
  w.appendChild(el('div', { class: 'big', html: catSvg(46) }));
  w.appendChild(el('h2', {}, '嗨，我是你的猫咪健康助手 🐱'));
  w.appendChild(el('p', {}, '把猫咪今天的情况告诉我——精神、吃喝、排泄、有没有呕吐或外伤，我帮你判断要不要尽快去医院。'));
  w.appendChild(el('p', { class: 'hint' }, '下方选一个常见情况试试，或直接描述你遇到的状况。'));
  box.appendChild(w);
}

/* ---------- render ---------- */
function renderUser(text) {
  const box = document.getElementById('chatBox');
  const w = el('div', { class: 'msg user' });
  w.appendChild(el('div', { class: 'ava', html: catSvg(22) }));
  w.appendChild(el('div', { class: 'bubble' }, text));
  box.appendChild(w);
  box.scrollTop = box.scrollHeight;
}

function renderAssistant(msg, payload) {
  const box = document.getElementById('chatBox');
  const u = msg.urgency_level || 'E3';
  const info = URG[u] || URG.E3;

  const w = el('div', { class: 'msg assistant' });
  w.appendChild(el('div', { class: 'ava', html: catSvg(22) }));
  const bub = el('div', { class: 'bubble' });

  // 头部：名称 + 风险等级（内置，不再外挂卡片）
  const head = el('div', { class: 'b-head' });
  head.appendChild(el('span', { class: 'name' }, '健康助手'));
  head.appendChild(el('span', { class: 'lvl ' + u }, u + ' · ' + info.t));
  bub.appendChild(head);

  // 正文
  bub.appendChild(el('div', { class: 'b-text' }, msg.answer || '(空)'));

  // 安全边界：作为助手回复内的轻量说明（内置，不挡视线）
  if (msg.diagnosis_boundary) {
    bub.appendChild(el('div', { class: 'boundary' }, '⚕️ ' + msg.diagnosis_boundary));
  }

  // 可做 / 禁忌
  const dos = el('div', { class: 'dos' });
  (msg.can_do || []).forEach(c => dos.appendChild(el('span', { class: 'tag' }, '✅ ' + c)));
  (msg.must_not || []).forEach(c => dos.appendChild(el('span', { class: 'tag no' }, '⛔ ' + c)));
  if (dos.childNodes.length) bub.appendChild(dos);

  // 下一步：纯文字引导，给用户继续追问的方向（不再可点击，避免误发整段）
  const steps = (msg.clarification_questions || []);
  if (steps.length) {
    const box = el('div', { class: 'nextask' });
    box.appendChild(el('div', { class: 'nextask-h' }, '下一步你可以问我：'));
    const list = el('div', { class: 'nextask-list' });
    steps.forEach(q => list.appendChild(el('div', { class: 'nextask-item' }, q)));
    box.appendChild(list);
    bub.appendChild(box);
  }

  // 折叠：意图理解（内置，默认收起）
  const intentEl = buildIntent(payload);
  if (intentEl) bub.appendChild(makeFold('🧠', '我理解你的情况', '', intentEl, false));

  // 折叠：证据来源（默认收起，给展开按钮）
  const evi = buildEvidence(payload);
  if (evi) {
    const n = (payload.retrieved_knowledge_ids || []).length || (payload.evidence || []).length || 0;
    bub.appendChild(makeFold('🔍', '权威证据来源', n ? n + ' 条' : '', evi, false));
  }

  // 折叠：调试推理过程（仅 debug，默认收起，重命名为「我是怎么思考的」）
  if (DEBUG) {
    const tr = buildTrace(payload.review);
    if (tr) bub.appendChild(makeFold('🛠', '我是怎么思考的（调试）', '', tr, false));
  }

  w.appendChild(bub);
  box.appendChild(w);
  box.scrollTop = box.scrollHeight;

  // 顶部等级 pill
  const pill = document.getElementById('urgPill');
  pill.className = 'pill ' + u;
  pill.textContent = u + ' · ' + info.t;
}

function humanIntent(field, value) {
  // 后端返回英文枚举值，这里统一转中文；未知/未识别 → 暂不了解
  if (!value || value === 'unknown' || value === '—') return '暂不了解';
  const MAP = {
    user_goal: {
      create_reminder: '设置提醒',
      whether_need_vet: '是否需就医',
      ask_what_to_do: '询问处理建议',
      ask_reason: '询问原因',
      describe_situation: '描述情况',
    },
    onset: {
      sudden: '急性突发',
      recurring: '反复发作',
      gradual: '逐渐发展',
      ongoing: '持续中',
    },
    severity: {
      '严重': '严重',
      '明显': '明显',
      '轻微': '轻微',
    },
  };
  if (MAP[field] && MAP[field][value]) return MAP[field][value];
  // timeline 等本身就是中文原文，直接展示
  return value;
}

function buildIntent(payload) {
  if (!payload) return null;
  const grid = el('dl', { class: 'intent-grid' });
  const rows = [
    ['用户目标', humanIntent('user_goal', payload.user_goal)],
    ['时间线', humanIntent('timeline', payload.timeline)],
    ['起病', humanIntent('onset', payload.onset)],
    ['严重程度', humanIntent('severity', payload.severity)],
  ];
  rows.forEach(([k, v]) => {
    grid.appendChild(el('dt', {}, k));
    grid.appendChild(el('dd', {}, v));
  });
  const sym = el('div', { class: 'sym' });
  (payload.normalized_symptoms || []).forEach(s => sym.appendChild(el('span', { class: 's' }, s)));
  if (sym.childNodes.length) {
    const wrap = el('div');
    wrap.appendChild(grid);
    wrap.appendChild(el('div', { style: 'margin-top:8px;font-size:12px;color:var(--faint)' }, '识别到的症状：'));
    wrap.appendChild(sym);
    if (payload.recognized_pet_name) {
      wrap.appendChild(el('div', { style: 'margin-top:8px;font-size:12.5px;color:var(--accent-d)' },
        '本轮昵称：' + payload.recognized_pet_name));
    }
    return wrap;
  }
  if (payload.recognized_pet_name) grid.appendChild(el('dt', {}, '昵称'));
  return grid;
}

function buildEvidence(payload) {
  const evs = payload.evidence || [];
  if (!evs.length) return null;
  const wrap = el('div');
  evs.forEach(e => {
    const card = el('div', { class: 'evi' });
    card.appendChild(el('div', { class: 'src', html:
      `<span class="kb">${e.source_id || '—'}</span>${escapeHtml(e.title || '')}<span class="org">${escapeHtml(e.organization || '')}</span>` }));
    const ex = (e.excerpts || [])[0];
    if (ex) card.appendChild(el('div', { class: 'ex' }, ex.excerpt || ''));
    card.appendChild(el('div', { class: 'meta' },
      'URL：' + (e.url || '—') + ' · 核验于 ' + (e.checked_at || '—')));
    wrap.appendChild(card);
  });
  return wrap;
}

function buildTrace(review) {
  if (!review) return null;
  const wrap = el('div');
  const passed = (review.attempts || []).filter(a => a.status === 'approved').length;
  const note = el('div', { class: 'trace-note' },
    `为保证回答可靠，我在证据不足时会自动升级检索 / 证据 / 断言档位，最终在第 ${passed} 次通过审核。` +
    `点击展开可见每一步用了哪些知识与判定。`);
  wrap.appendChild(note);
  const tb = el('div', { class: 'trace' });
  (review.attempts || []).forEach((a, i) => {
    const prev = i > 0 ? review.attempts[i - 1] : null;
    const lv = (k) => prev && prev[k] !== a[k]
      ? `<span class="lv">${prev[k]}→${a[k]}</span>` : a[k];
    const step = el('div', { class: 'step' });
    step.innerHTML =
`<div>第 ${a.attempt} 次 · 检索 ${lv('retrieve')} · 证据 ${lv('evidence')} · 断言 ${lv('assert')}</div>` +
`<div>知识：${(a.kb || []).join('、') || '∅'}　证据ID：${(a.evidence_ids || []).join('、') || '∅'}</div>` +
`<div>问题：${(a.issues || []).map(s => `<span class="iss">${s}</span>`).join(' / ') || '∅'}</div>` +
`<div>状态：<span class="${a.status === 'approved' ? 'ok' : 'iss'}">${a.status}</span> · 耗时 ${a.elapsed_ms || 0}ms</div>`;
    tb.appendChild(step);
  });
  wrap.appendChild(tb);
  return wrap;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- send ---------- */
let inFlight = false;
async function send() {
  const ipt = document.getElementById('input');
  const text = ipt.value.trim();
  if (!text || inFlight) return;
  ipt.value = ''; autoGrow();
  inFlight = true;
  document.getElementById('sendBtn').disabled = true;

  // 首条消息后移除欢迎语
  const wel = document.querySelector('.welcome');
  if (wel) wel.remove();

  renderUser(text);
  const typing = showTyping();
  try {
    const data = await api('POST', '/api/v1/chat', {
      sessionId,
      messages: [{ role: 'user', content: text }],
    });
    typing.remove();
    renderAssistant(data, data);
  } catch (e) {
    if (typing) typing.remove();
    renderAssistant({ urgency_level: 'E3', answer: '⚠️ 出错了：' + (e.message || JSON.stringify(e)) }, {});
  } finally {
    inFlight = false;
    document.getElementById('sendBtn').disabled = false;
    ipt.focus();
  }
}

async function resetSession() {
  await api('POST', '/api/v1/reset', { sessionId });
  document.getElementById('chatBox').innerHTML = '';
  const pill = document.getElementById('urgPill');
  pill.className = 'pill'; pill.textContent = '—';
  showWelcome();
  toast('已开启新对话');
}

/* ---------- bootstrap ---------- */
(async () => {
  try {
    const health = await api('GET', '/api/v1/health');
    const bs = await api('GET', `/api/v1/bootstrap?sessionId=${encodeURIComponent(sessionId)}`);
    const msgs = bs.messages || [];
    if (!msgs.length) {
      showWelcome();
    } else {
      msgs.forEach(m => { if (m.role === 'user') renderUser(m.content); });
    }
    if (bs.profile && bs.profile.name) toast('已恢复档案：' + bs.profile.name);
    // 顶栏无显式 KB 计数，保持清爽；调试信息仅在需要时
    void health;
  } catch (e) {
    showWelcome();
    toast('启动失败：' + (e.message || JSON.stringify(e)));
  }

  const ipt = document.getElementById('input');
  ipt.addEventListener('input', autoGrow);
  ipt.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  ipt.focus();
})();
</script>
